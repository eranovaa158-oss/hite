name: Build IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Pick newest installed Xcode
        run: |
          set -x
          ls /Applications | grep Xcode || true
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json", encoding="utf-8-sig"))["xcode"])')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          else
            echo "versions.json Xcode ($XCODE_VERSION) missing; keeping default:" $(xcode-select -p)
            echo "Make.py runs with --overrideXcodeVersion, so the image default is used."
          fi

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo cp -R $GITHUB_WORKSPACE /Users/Shared/hitegram-build
          sudo chown -R $(whoami):staff /Users/Shared/hitegram-build
          cd /Users/Shared/hitegram-build
          # Submodules were checked out into $GITHUB_WORKSPACE; make sure they came along.
          ls third-party/mtproto-engine | head -3

      - name: Refresh provisioning profile expiration
        run: |
          set -x
          cd /Users/Shared/hitegram-build
          python3 build-system/Make/RefreshProfiles.py --profiles-dir build-system/fake-codesigning/profiles --cert-p12 build-system/fake-codesigning/certs/SelfSigned.p12

      - name: Build the App
        run: |
          set -x

          SOURCE_DIR=/Users/Shared/hitegram-build
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_hitegram"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json", encoding="utf-8-sig"))["app"])')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" "$OUTPUT_PATH/hitegram-$APP_VERSION-$BUILD_NUMBER.ipa"
          done
          ls -la "$OUTPUT_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: hitegram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/hitegram-build/build/artifacts/*.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: hitegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned build of hitegram (Telegram iOS ${{ env.APP_VERSION }}).
            Install via Sideloadly / AltStore.
          files: /Users/Shared/hitegram-build/build/artifacts/*.ipa
          draft: false
          prerelease: false