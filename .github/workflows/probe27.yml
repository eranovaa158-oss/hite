name: Probe macOS 27
on:
  workflow_dispatch:

jobs:
  mac27:
    runs-on: macos-27
    timeout-minutes: 10
    steps:
      - name: Probe runner and Xcode
        run: |
          echo "RUNNER_OK"
          sw_vers
          ls /Applications | grep Xcode || true
          xcodebuild -version || true
          python3 --version
